<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BJD管理屋</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff0f3;min-height:100vh;color:#c9184a;padding-bottom:80px}

        .header{background:linear-gradient(135deg,#ff6b9d,#ff4d6d);padding:20px 15px 25px;border-radius:0 0 30px 30px}
        .header h1{color:#fff;font-size:26px;text-align:center}
        .header p{color:rgba(255,255,255,0.85);text-align:center;font-size:13px;margin-top:5px}

        .nav{display:flex;gap:10px;justify-content:center;margin-top:15px}
        .nav button{padding:12px 24px;border-radius:20px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:rgba(255,255,255,0.25);color:#fff}
        .nav button.active{background:#fff;color:#e83e5c}

        .main{padding:15px;max-width:600px;margin:0 auto}
        .section{display:none}
        .section.active{display:block}

        .card{background:#fff;border-radius:20px;padding:18px;margin-bottom:15px;box-shadow:0 4px 20px rgba(255,77,109,0.15);border:2px solid #ffd1dc}

        .btn{background:linear-gradient(135deg,#ff758f,#e83e5c);color:#fff;border:none;padding:12px 20px;border-radius:16px;font-size:14px;font-weight:700;cursor:pointer}
        .btn-sm{padding:8px 14px;font-size:12px}
        .btn-full{width:100%}

        .form-group{margin-bottom:14px}
        .form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:#c9184a}
        .form-group input,.form-group select{width:100%;padding:12px 15px;border:2px solid #ffb3c6;border-radius:14px;font-size:15px;color:#a4133c;background:#fff0f3}

        .upload{border:3px dashed #ffb3c6;border-radius:18px;padding:30px;text-align:center;background:#fff0f3;cursor:pointer}
        .upload div:first-child{font-size:40px;margin-bottom:10px}
        .upload div:nth-child(2){color:#e83e5c;font-size:14px;font-weight:700}

        .body-card{background:#fff;border-radius:20px;margin-bottom:12px;display:flex;overflow:hidden;box-shadow:0 4px 20px rgba(255,77,109,0.15);border:2px solid #ffd1dc}
        .body-card .img{width:120px;min-height:120px;background:linear-gradient(135deg,#ffd1dc,#ffb3c6);display:flex;align-items:center;justify-content:center;font-size:50px;flex-shrink:0}
        .body-card .img img{width:100%;height:100%;object-fit:cover}
        .body-card .info{padding:15px;flex:1;min-width:0}
        .body-card .name{font-size:16px;font-weight:700;color:#c9184a;margin-bottom:4px}
        .body-card .meta{font-size:12px;color:#ff8fab;margin-bottom:10px}
        .body-card .specs{display:flex;flex-wrap:wrap;gap:6px}
        .body-card .spec{padding:4px 10px;background:#fff0f3;border-radius:10px;font-size:11px}
        .body-card .spec span:first-child{color:#ff8fab}
        .body-card .spec span:last-child{color:#e83e5c;font-weight:700}
        .body-card .projects{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
        .body-card .project-tag{padding:3px 10px;border-radius:10px;font-size:11px;background:linear-gradient(135deg,#ff758f,#e83e5c);color:#fff;font-weight:600}

        .wardrobe-item{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px;display:flex;gap:15px;align-items:center;border:2px solid #ffd1dc;box-shadow:0 4px 20px rgba(255,77,109,0.12)}
        .wardrobe-item .img{width:70px;height:70px;background:linear-gradient(135deg,#ffd1dc,#ffb3c6);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;overflow:hidden}
        .wardrobe-item .img img{width:100%;height:100%;object-fit:cover}
        .wardrobe-item .info{flex:1;min-width:0}
        .wardrobe-item .name{font-size:15px;font-weight:700;color:#c9184a;margin-bottom:5px}
        .wardrobe-item .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:#ff8fab}
        .wardrobe-item .colors{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
        .wardrobe-item .color-tag{padding:3px 10px;border-radius:10px;font-size:11px;background:#ffb3c6;color:#fff;font-weight:600}

        .card-actions{display:flex;gap:8px;margin-top:10px}
        .card-actions button{padding:6px 14px;border-radius:12px;font-size:12px;cursor:pointer;font-weight:700;border:2px solid #ffb3c6;background:#fff0f3;color:#e83e5c}
        .card-actions .del{background:#ffd1dc;color:#c9184a;border-color:#ffb3c6}

        .fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#ff758f,#e83e5c);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 6px 20px rgba(255,77,109,0.4);z-index:100}

        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:flex-end;z-index:1000}
        .modal.show{display:flex}
        .modal .content{background:#fff;border-radius:30px 30px 0 0;padding:25px 20px;width:100%;max-height:90vh;overflow-y:auto;transform:translateY(100%);transition:transform 0.3s}
        .modal.show .content{transform:translateY(0)}
        .modal .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px dashed #ffb3c6}
        .modal .header h3{font-size:20px;color:#c9184a}
        .modal .header button{width:36px;height:36px;border-radius:50%;border:none;background:#ffd1dc;color:#e83e5c;font-size:20px;cursor:pointer}

        .empty{text-align:center;padding:60px 20px;display:none}
        .empty.show{display:block}
        .empty .icon{font-size:60px;opacity:0.3;margin-bottom:15px}
        .empty .text{font-size:16px;color:#ff8fab;font-weight:700}

        .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

        .preview{margin-top:10px}
        .preview img{max-width:150px;border-radius:14px;border:3px solid #ffb3c6}

        .tag-input{display:flex;gap:8px;margin-top:8px}
        .tag-input input{flex:1}
        .tag-input button{padding:10px 16px}
        .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
        .tag-item{padding:5px 12px;border-radius:12px;font-size:12px;background:linear-gradient(135deg,#ff758f,#e83e5c);color:#fff;font-weight:600;display:flex;align-items:center;gap:5px}
        .tag-item .del{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}

        .preset-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
        .preset-tag{padding:6px 14px;border-radius:14px;font-size:13px;background:#fff0f3;color:#e83e5c;border:2px solid #ffb3c6;cursor:pointer;font-weight:600}
        .preset-tag.active{background:linear-gradient(135deg,#ff758f,#e83e5c);color:#fff;border-color:#e83e5c}

        .filter-box{margin-bottom:10px}
        .filter-label{font-size:13px;color:#c9184a;font-weight:700;margin-bottom:8px}
        .filter-tags{display:flex;flex-wrap:wrap;gap:8px}
        .filter-tag{padding:6px 14px;border-radius:14px;font-size:13px;background:#fff0f3;color:#e83e5c;border:2px solid #ffb3c6;cursor:pointer;font-weight:600}
        .filter-tag.active{background:linear-gradient(135deg,#ff758f,#e83e5c);color:#fff;border-color:#e83e5c}
    </style>
</head>
<body>
    <div class="header">
        <h1>🎀 BJD管理屋</h1>
        <p>素体 · 衣橱管理</p>
        <div class="nav">
            <button class="active" onclick="switchTab('bodies')" id="nav-bodies">🧸 素体</button>
            <button onclick="switchTab('wardrobe')" id="nav-wardrobe">👗 衣橱</button>
        </div>
    </div>

    <div class="main">
        <!-- 素体 -->
        <div class="section active" id="section-bodies">
            <div class="card">
                <div style="margin-bottom:15px">
                    <select id="f-size" onchange="renderBodies()" style="padding:10px;border-radius:12px;border:2px solid #ffb3c6;background:#fff0f3;color:#a4133c;width:100%;margin-bottom:10px">
                        <option value="">全部尺寸</option>
                        <option value="十二分">十二分</option>
                        <option value="八分">八分</option>
                        <option value="六分">六分</option>
                        <option value="特六">特六</option>
                        <option value="四分">四分</option>
                        <option value="三分">三分</option>
                    </select>
                    <div class="filter-box">
                        <div class="filter-label">筛选企划方：</div>
                        <div class="filter-tags" id="f-projects"></div>
                    </div>
                </div>
                <div id="bodies-list"></div>
                <div class="empty" id="bodies-empty">
                    <div class="icon">🧸</div>
                    <div class="text">还没有素体~<br>点击右下角 + 添加</div>
                </div>
            </div>
        </div>

        <!-- 衣橱 -->
        <div class="section" id="section-wardrobe">
            <div class="card">
                <div style="display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap">
                    <select id="f-type" onchange="renderWardrobe()" style="padding:10px;border-radius:12px;border:2px solid #ffb3c6;background:#fff0f3;color:#a4133c">
                        <option value="">全部类型</option>
                        <option value="上衣">上衣</option>
                        <option value="下装">下装</option>
                        <option value="连衣裙">连衣裙</option>
                        <option value="外套">外套</option>
                        <option value="鞋子">鞋子</option>
                        <option value="配饰">配饰</option>
                        <option value="假发">假发</option>
                        <option value="眼珠">眼珠</option>
                        <option value="其他">其他</option>
                    </select>
                    <input type="text" id="f-color" placeholder="筛选颜色" oninput="renderWardrobe()" style="padding:10px;border-radius:12px;border:2px solid #ffb3c6;background:#fff0f3;flex:1;min-width:120px;color:#a4133c">
                </div>
                <div id="wardrobe-list"></div>
                <div class="empty" id="wardrobe-empty">
                    <div class="icon">👗</div>
                    <div class="text">衣橱是空的~</div>
                </div>
            </div>
        </div>
    </div>

    <button class="fab" onclick="showAdd()">➕</button>

    <!-- 添加/编辑素体 -->
    <div class="modal" id="modal-body">
        <div class="content">
            <div class="header">
                <h3 id="body-modal-title">🧸 添加素体</h3>
                <button onclick="closeModal('modal-body')">×</button>
            </div>
            <form id="form-body" onsubmit="saveBody(event)">
                <div class="form-group">
                    <label>素体图片</label>
                    <div class="upload" onclick="document.getElementById('b-file').click()">
                        <div>📷</div>
                        <div>点击上传图片</div>
                    </div>
                    <input type="file" id="b-file" style="display:none" accept="image/*" onchange="preview(this,'b-prev')">
                    <div class="preview" id="b-prev"></div>
                </div>
                <div class="grid2">
                    <div class="form-group">
                        <label>名称 *</label>
                        <input type="text" id="b-name" required placeholder="萌萌体">
                    </div>
                    <div class="form-group">
                        <label>尺寸 *</label>
                        <select id="b-size" required>
                            <option value="">请选择</option>
                            <option>十二分</option><option>八分</option><option>六分</option>
                            <option>特六</option><option>四分</option><option>三分</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>企划方 *</label>
                    <div class="preset-tags" id="b-project-presets">
                        <span class="preset-tag" onclick="toggleProject(this,'米甜')">米甜</span>
                        <span class="preset-tag" onclick="toggleProject(this,'邦倪兔')">邦倪兔</span>
                        <span class="preset-tag" onclick="toggleProject(this,'儞洛')">儞洛</span>
                        <span class="preset-tag" onclick="toggleProject(this,'未语集')">未语集</span>
                        <span class="preset-tag" onclick="toggleProject(this,'悸动瞬息')">悸动瞬息</span>
                        <span class="preset-tag" onclick="toggleProject(this,'未启之扉')">未启之扉</span>
                        <span class="preset-tag" onclick="toggleProject(this,'露露灵')">露露灵</span>
                        <span class="preset-tag" onclick="toggleProject(this,'魔屋阿特')">魔屋阿特</span>
                    </div>
                    <div class="tag-input" style="margin-top:8px">
                        <input type="text" id="b-project-input" placeholder="自定义企划方">
                        <button type="button" class="btn btn-sm" onclick="addCustomProject()">添加</button>
                    </div>
                    <div class="tags" id="b-projects"></div>
                </div>
                <div class="form-group">
                    <label>厂家（工厂）</label>
                    <input type="text" id="b-brand" placeholder="SOOM">
                </div>
                <div class="form-group">
                    <label>肤色 *</label>
                    <select id="b-skin" required>
                        <option value="">请选择</option>
                        <option>白肌</option><option>普肌</option><option>黄肌</option>
                        <option>烧肌</option><option>粉肌</option><option>半白</option>
                    </select>
                </div>
                <div class="grid2">
                    <div class="form-group">
                        <label>头围(cm)</label>
                        <input type="number" id="b-head" step="0.1" placeholder="12.5">
                    </div>
                    <div class="form-group">
                        <label>素体身高(cm)</label>
                        <input type="number" id="b-height" step="0.1" placeholder="12.4">
                    </div>
                    <div class="form-group">
                        <label>脖围(cm)</label>
                        <input type="number" id="b-neck" step="0.1" placeholder="2.7">
                    </div>
                    <div class="form-group">
                        <label>臀围(cm)</label>
                        <input type="number" id="b-hip" step="0.1" placeholder="8.2">
                    </div>
                    <div class="form-group">
                        <label>脚长(cm)</label>
                        <input type="number" id="b-foot-l" step="0.1" placeholder="1.8">
                    </div>
                    <div class="form-group">
                        <label>脚宽(cm)</label>
                        <input type="number" id="b-foot-w" step="0.1" placeholder="0.8">
                    </div>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" id="b-notes" placeholder="购买渠道、妆师等">
                </div>
                <button type="submit" class="btn btn-full">💾 保存素体</button>
            </form>
        </div>
    </div>

    <!-- 添加/编辑衣橱 -->
    <div class="modal" id="modal-wardrobe">
        <div class="content">
            <div class="header">
                <h3 id="wardrobe-modal-title">👗 添加物品</h3>
                <button onclick="closeModal('modal-wardrobe')">×</button>
            </div>
            <form id="form-wardrobe" onsubmit="saveWardrobe(event)">
                <div class="form-group">
                    <label>物品图片</label>
                    <div class="upload" onclick="document.getElementById('w-file').click()">
                        <div>📷</div>
                        <div>点击上传图片</div>
                    </div>
                    <input type="file" id="w-file" style="display:none" accept="image/*" onchange="preview(this,'w-prev')">
                    <div class="preview" id="w-prev"></div>
                </div>
                <div class="grid2">
                    <div class="form-group">
                        <label>名称 *</label>
                        <input type="text" id="w-name" required>
                    </div>
                    <div class="form-group">
                        <label>类型 *</label>
                        <select id="w-type" required>
                            <option value="">请选择</option>
                            <option>上衣</option><option>下装</option><option>连衣裙</option>
                            <option>外套</option><option>鞋子</option><option>配饰</option>
                            <option>假发</option><option>眼珠</option><option>其他</option>
                        </select>
                    </div>
                </div>
                <div class="grid2">
                    <div class="form-group">
                        <label>适用尺寸</label>
                        <input type="text" id="w-size" placeholder="六分、四分">
                    </div>
                    <div class="form-group">
                        <label>适配体子</label>
                        <input type="text" id="w-body" placeholder="萌萌体">
                    </div>
                </div>
                <div class="form-group">
                    <label>颜色标签（可多个）</label>
                    <div class="tag-input">
                        <input type="text" id="w-color-input" placeholder="输入颜色">
                        <button type="button" class="btn btn-sm" onclick="addColor()">添加</button>
                    </div>
                    <div class="preset-tags" id="w-color-presets">
                        <span class="preset-tag" onclick="toggleColor(this,'粉色')">粉色</span>
                        <span class="preset-tag" onclick="toggleColor(this,'白色')">白色</span>
                        <span class="preset-tag" onclick="toggleColor(this,'黑色')">黑色</span>
                        <span class="preset-tag" onclick="toggleColor(this,'红色')">红色</span>
                        <span class="preset-tag" onclick="toggleColor(this,'蓝色')">蓝色</span>
                        <span class="preset-tag" onclick="toggleColor(this,'紫色')">紫色</span>
                        <span class="preset-tag" onclick="toggleColor(this,'黄色')">黄色</span>
                        <span class="preset-tag" onclick="toggleColor(this,'绿色')">绿色</span>
                        <span class="preset-tag" onclick="toggleColor(this,'棕色')">棕色</span>
                        <span class="preset-tag" onclick="toggleColor(this,'灰色')">灰色</span>
                    </div>
                    <div class="tags" id="w-colors"></div>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" id="w-notes" placeholder="材质、版型等">
                </div>
                <button type="submit" class="btn btn-full">💾 保存物品</button>
            </form>
        </div>
    </div>

    <script>
        // ========== 数据 ==========
        var data = {bodies:[], wardrobe:[]};
        var current = 'bodies';
        var tempImg = '';
        var tempProjects = [];
        var tempColors = [];
        var editingId = null;
        var allProjects = ['米甜','邦倪兔','儞洛','未语集','悸动瞬息','未启之扉','露露灵','魔屋阿特'];
        var filterProject = '';

        // HTML转义，防止名称里的特殊字符破坏页面
        function esc(s){
            if(s == null) return '';
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        // ========== 本地存储（带异常处理） ==========
        function loadData(){
            var s = localStorage.getItem('bjd');
            if(s){
                try{
                    var d = JSON.parse(s);
                    if(d && d.bodies && d.wardrobe) data = d;
                }catch(e){
                    console.log('load error', e);
                }
            }
        }

        function saveData(){
            try{
                localStorage.setItem('bjd', JSON.stringify(data));
            }catch(e){
                alert('⚠️ 存储空间不足！图片太多啦~\n请删除一些带大图的项目，或之后少上传几张图片。');
            }
        }

        // ========== 标签页切换 ==========
        function switchTab(tab){
            current = tab;
            document.getElementById('nav-bodies').className = tab == 'bodies' ? 'active' : '';
            document.getElementById('nav-wardrobe').className = tab == 'wardrobe' ? 'active' : '';
            document.getElementById('section-bodies').className = 'section' + (tab == 'bodies' ? ' active' : '');
            document.getElementById('section-wardrobe').className = 'section' + (tab == 'wardrobe' ? ' active' : '');
            renderAll();
        }

        // ========== 模态框 ==========
        function resetFormState(){
            tempImg = '';
            tempProjects = [];
            tempColors = [];
            editingId = null;
            document.getElementById('b-prev').innerHTML = '';
            document.getElementById('w-prev').innerHTML = '';
            document.getElementById('b-projects').innerHTML = '';
            document.getElementById('w-colors').innerHTML = '';
            // 关键修复：清空文件选择器，否则再次选同一张图不会触发 onchange
            document.getElementById('b-file').value = '';
            document.getElementById('w-file').value = '';
            var ps = document.querySelectorAll('.preset-tag');
            for(var i = 0; i < ps.length; i++) ps[i].className = 'preset-tag';
        }

        function showAdd(){
            resetFormState();
            if(current == 'bodies'){
                document.getElementById('form-body').reset();
                document.getElementById('body-modal-title').textContent = '🧸 添加素体';
                document.getElementById('modal-body').className = 'modal show';
            }else{
                document.getElementById('form-wardrobe').reset();
                document.getElementById('wardrobe-modal-title').textContent = '👗 添加物品';
                document.getElementById('modal-wardrobe').className = 'modal show';
            }
        }

        function closeModal(id){
            document.getElementById(id).className = 'modal';
            var form = document.getElementById(id).querySelector('form');
            if(form) form.reset();
            resetFormState();
        }

        // ========== 图片：读取 + 压缩（修复localStorage爆容量） ==========
        function preview(input, pid){
            var file = input.files[0];
            if(!file) return;
            var reader = new FileReader();
            reader.onload = function(e){
                compressImage(e.target.result, function(dataUrl){
                    tempImg = dataUrl;
                    document.getElementById(pid).innerHTML = '<img src="' + dataUrl + '">';
                });
            };
            reader.readAsDataURL(file);
            input.value = ''; // 允许再次选择同一文件
        }

        function compressImage(dataUrl, cb){
            var img = new Image();
            img.onload = function(){
                var max = 800;
                var w = img.width, h = img.height;
                if(w > max || h > max){
                    if(w > h){ h = Math.round(h * max / w); w = max; }
                    else { w = Math.round(w * max / h); h = max; }
                }
                try{
                    var c = document.createElement('canvas');
                    c.width = w; c.height = h;
                    c.getContext('2d').drawImage(img, 0, 0, w, h);
                    cb(c.toDataURL('image/jpeg', 0.75));
                }catch(e){
                    cb(dataUrl);
                }
            };
            img.onerror = function(){ cb(dataUrl); };
            img.src = dataUrl;
        }

        // ========== 企划方标签 ==========
        function toggleProject(el, name){
            var idx = tempProjects.indexOf(name);
            if(idx == -1){
                tempProjects.push(name);
                el.className = 'preset-tag active';
            }else{
                tempProjects.splice(idx, 1);
                el.className = 'preset-tag';
            }
            renderProjectTags();
        }

        function addCustomProject(){
            var input = document.getElementById('b-project-input');
            var val = input.value.trim();
            if(!val) return;
            if(tempProjects.indexOf(val) == -1){
                tempProjects.push(val);
                renderProjectTags();
            }
            input.value = '';
        }

        function removeProject(idx){
            tempProjects.splice(idx, 1);
            renderProjectTags();
            syncProjectPresets();
        }

        function syncProjectPresets(){
            var ps = document.querySelectorAll('#b-project-presets .preset-tag');
            for(var i = 0; i < ps.length; i++){
                ps[i].className = tempProjects.indexOf(ps[i].textContent) > -1 ? 'preset-tag active' : 'preset-tag';
            }
        }

        function renderProjectTags(){
            var html = '';
            for(var i = 0; i < tempProjects.length; i++){
                html += '<span class="tag-item">' + esc(tempProjects[i]) + '<span class="del" onclick="removeProject(' + i + ')">×</span></span>';
            }
            document.getElementById('b-projects').innerHTML = html;
        }

        // ========== 颜色标签 ==========
        function toggleColor(el, name){
            var idx = tempColors.indexOf(name);
            if(idx == -1){
                tempColors.push(name);
                el.className = 'preset-tag active';
            }else{
                tempColors.splice(idx, 1);
                el.className = 'preset-tag';
            }
            renderColorTags();
        }

        function addColor(){
            var input = document.getElementById('w-color-input');
            var val = input.value.trim();
            if(!val) return;
            if(tempColors.indexOf(val) == -1){
                tempColors.push(val);
                renderColorTags();
            }
            input.value = '';
        }

        function removeColor(idx){
            tempColors.splice(idx, 1);
            renderColorTags();
            var ps = document.querySelectorAll('#w-color-presets .preset-tag');
            for(var i = 0; i < ps.length; i++){
                ps[i].className = tempColors.indexOf(ps[i].textContent) > -1 ? 'preset-tag active' : 'preset-tag';
            }
        }

        function renderColorTags(){
            var html = '';
            for(var i = 0; i < tempColors.length; i++){
                html += '<span class="tag-item">' + esc(tempColors[i]) + '<span class="del" onclick="removeColor(' + i + ')">×</span></span>';
            }
            document.getElementById('w-colors').innerHTML = html;
        }

        // ========== 筛选 ==========
        function setFilterProject(name){
            filterProject = (filterProject == name) ? '' : name;
            renderFilterProjects();
            renderBodies();
        }

        function renderFilterProjects(){
            var box = document.getElementById('f-projects');
            if(!box) return;
            var html = '';
            for(var i = 0; i < allProjects.length; i++){
                var active = filterProject == allProjects[i] ? ' active' : '';
                html += '<span class="filter-tag' + active + '" onclick="setFilterProject(\'' + allProjects[i] + '\')">' + allProjects[i] + '</span>';
            }
            box.innerHTML = html;
        }

        // ========== 保存（新增 / 编辑） ==========
        function saveBody(e){
            e.preventDefault();
            if(tempProjects.length == 0){
                alert('请至少选择一个企划方');
                return;
            }
            var body = {
                id: editingId || Date.now(),
                name: document.getElementById('b-name').value,
                size: document.getElementById('b-size').value,
                projects: tempProjects.slice(),
                brand: document.getElementById('b-brand').value,
                skin: document.getElementById('b-skin').value,
                image: tempImg,
                head: document.getElementById('b-head').value,
                height: document.getElementById('b-height').value,
                neck: document.getElementById('b-neck').value,
                hip: document.getElementById('b-hip').value,
                footL: document.getElementById('b-foot-l').value,
                footW: document.getElementById('b-foot-w').value,
                notes: document.getElementById('b-notes').value
            };
            if(editingId){
                for(var i = 0; i < data.bodies.length; i++){
                    if(data.bodies[i].id == editingId){ data.bodies[i] = body; break; }
                }
            }else{
                data.bodies.push(body);
            }
            saveData();
            closeModal('modal-body');
            renderBodies();
        }

        function saveWardrobe(e){
            e.preventDefault();
            var item = {
                id: editingId || Date.now(),
                name: document.getElementById('w-name').value,
                type: document.getElementById('w-type').value,
                size: document.getElementById('w-size').value,
                body: document.getElementById('w-body').value,
                colors: tempColors.slice(),
                image: tempImg,
                notes: document.getElementById('w-notes').value
            };
            if(editingId){
                for(var i = 0; i < data.wardrobe.length; i++){
                    if(data.wardrobe[i].id == editingId){ data.wardrobe[i] = item; break; }
                }
            }else{
                data.wardrobe.push(item);
            }
            saveData();
            closeModal('modal-wardrobe');
            renderWardrobe();
        }

        // ========== 编辑 / 删除 ==========
        function editBody(id){
            var b = null;
            for(var i = 0; i < data.bodies.length; i++){
                if(data.bodies[i].id == id){ b = data.bodies[i]; break; }
            }
            if(!b) return;
            resetFormState();
            editingId = id;
            document.getElementById('body-modal-title').textContent = '🧸 编辑素体';
            document.getElementById('b-name').value = b.name || '';
            document.getElementById('b-size').value = b.size || '';
            document.getElementById('b-brand').value = b.brand || '';
            document.getElementById('b-skin').value = b.skin || '';
            document.getElementById('b-head').value = b.head || '';
            document.getElementById('b-height').value = b.height || '';
            document.getElementById('b-neck').value = b.neck || '';
            document.getElementById('b-hip').value = b.hip || '';
            document.getElementById('b-foot-l').value = b.footL || '';
            document.getElementById('b-foot-w').value = b.footW || '';
            document.getElementById('b-notes').value = b.notes || '';
            tempProjects = (b.projects || []).slice();
            tempImg = b.image || '';
            if(tempImg) document.getElementById('b-prev').innerHTML = '<img src="' + tempImg + '">';
            renderProjectTags();
            syncProjectPresets();
            document.getElementById('modal-body').className = 'modal show';
        }

        function deleteBody(id){
            if(!confirm('确定删除这个素体吗？')) return;
            data.bodies = data.bodies.filter(function(b){ return b.id != id; });
            saveData();
            renderBodies();
        }

        function editWardrobe(id){
            var w = null;
            for(var i = 0; i < data.wardrobe.length; i++){
                if(data.wardrobe[i].id == id){ w = data.wardrobe[i]; break; }
            }
            if(!w) return;
            resetFormState();
            editingId = id;
            document.getElementById('wardrobe-modal-title').textContent = '👗 编辑物品';
            document.getElementById('w-name').value = w.name || '';
            document.getElementById('w-type').value = w.type || '';
            document.getElementById('w-size').value = w.size || '';
            document.getElementById('w-body').value = w.body || '';
            document.getElementById('w-notes').value = w.notes || '';
            tempColors = (w.colors || []).slice();
            tempImg = w.image || '';
            if(tempImg) document.getElementById('w-prev').innerHTML = '<img src="' + tempImg + '">';
            renderColorTags();
            var ps = document.querySelectorAll('#w-color-presets .preset-tag');
            for(var i = 0; i < ps.length; i++){
                ps[i].className = tempColors.indexOf(ps[i].textContent) > -1 ? 'preset-tag active' : 'preset-tag';
            }
            document.getElementById('modal-wardrobe').className = 'modal show';
        }

        function deleteWardrobe(id){
            if(!confirm('确定删除这件物品吗？')) return;
            data.wardrobe = data.wardrobe.filter(function(w){ return w.id != id; });
            saveData();
            renderWardrobe();
        }

        // ========== 渲染 ==========
        function renderAll(){
            renderFilterProjects();
            renderBodies();
            renderWardrobe();
        }

        function renderBodies(){
            var list = document.getElementById('bodies-list');
            var empty = document.getElementById('bodies-empty');
            var fs = document.getElementById('f-size').value;

            var arr = [];
            for(var i = 0; i < data.bodies.length; i++){
                var b = data.bodies[i];
                if(fs && b.size != fs) continue;
                if(filterProject){
                    var hasP = false;
                    var ps = b.projects || [];
                    for(var j = 0; j < ps.length; j++){
                        if(ps[j] == filterProject){ hasP = true; break; }
                    }
                    if(!hasP) continue;
                }
                arr.push(b);
            }

            if(arr.length == 0){
                list.innerHTML = '';
                empty.className = 'empty show';
                return;
            }
            empty.className = 'empty';

            var html = '';
            for(var i = 0; i < arr.length; i++){
                var b = arr[i];
                html += '<div class="body-card">';
                html += '<div class="img">' + (b.image ? '<img src="' + b.image + '">' : '🧸') + '</div>';
                html += '<div class="info">';
                html += '<div class="name">' + esc(b.name) + '</div>';
                html += '<div class="meta">' + esc(b.size) + ' · ' + esc(b.skin) + (b.brand ? ' · ' + esc(b.brand) : '') + '</div>';
                if(b.projects && b.projects.length){
                    html += '<div class="projects">';
                    for(var j = 0; j < b.projects.length; j++){
                        html += '<span class="project-tag">' + esc(b.projects[j]) + '</span>';
                    }
                    html += '</div>';
                }
                // 尺寸规格
                var specs = [];
                if(b.head) specs.push(['头围', b.head]);
                if(b.height) specs.push(['身高', b.height]);
                if(b.neck) specs.push(['脖围', b.neck]);
                if(b.hip) specs.push(['臀围', b.hip]);
                if(b.footL) specs.push(['脚长', b.footL]);
                if(b.footW) specs.push(['脚宽', b.footW]);
                if(specs.length){
                    html += '<div class="specs" style="margin-top:8px">';
                    for(var k = 0; k < specs.length; k++){
                        html += '<div class="spec"><span>' + specs[k][0] + '</span> <span>' + esc(specs[k][1]) + '</span></div>';
                    }
                    html += '</div>';
                }
                if(b.notes){
                    html += '<div class="meta" style="margin-top:8px">📝 ' + esc(b.notes) + '</div>';
                }
                html += '<div class="card-actions">';
                html += '<button onclick="editBody(' + b.id + ')">✏️ 编辑</button>';
                html += '<button class="del" onclick="deleteBody(' + b.id + ')">🗑 删除</button>';
                html += '</div>';
                html += '</div></div>';
            }
            list.innerHTML = html;
        }

        function renderWardrobe(){
            var list = document.getElementById('wardrobe-list');
            var empty = document.getElementById('wardrobe-empty');
            var ft = document.getElementById('f-type').value;
            var fc = document.getElementById('f-color').value.trim();

            var arr = [];
            for(var i = 0; i < data.wardrobe.length; i++){
                var w = data.wardrobe[i];
                if(ft && w.type != ft) continue;
                if(fc){
                    var hasC = false;
                    var cs = w.colors || [];
                    for(var j = 0; j < cs.length; j++){
                        if(cs[j].indexOf(fc) > -1){ hasC = true; break; }
                    }
                    if(!hasC) continue;
                }
                arr.push(w);
            }

            if(arr.length == 0){
                list.innerHTML = '';
                empty.className = 'empty show';
                return;
            }
            empty.className = 'empty';

            var html = '';
            for(var i = 0; i < arr.length; i++){
                var w = arr[i];
                html += '<div class="wardrobe-item">';
                html += '<div class="img">' + (w.image ? '<img src="' + w.image + '">' : '👗') + '</div>';
                html += '<div class="info">';
                html += '<div class="name">' + esc(w.name) + '</div>';
                html += '<div class="meta">';
                html += '<span>' + esc(w.type) + '</span>';
                if(w.size) html += '<span>· ' + esc(w.size) + '</span>';
                if(w.body) html += '<span>· 适配:' + esc(w.body) + '</span>';
                html += '</div>';
                if(w.colors && w.colors.length){
                    html += '<div class="colors">';
                    for(var j = 0; j < w.colors.length; j++){
                        html += '<span class="color-tag">' + esc(w.colors[j]) + '</span>';
                    }
                    html += '</div>';
                }
                if(w.notes){
                    html += '<div class="meta" style="margin-top:6px">📝 ' + esc(w.notes) + '</div>';
                }
                html += '<div class="card-actions">';
                html += '<button onclick="editWardrobe(' + w.id + ')">✏️ 编辑</button>';
                html += '<button class="del" onclick="deleteWardrobe(' + w.id + ')">🗑 删除</button>';
                html += '</div>';
                html += '</div></div>';
            }
            list.innerHTML = html;
        }

        // ========== 初始化（原代码缺失的关键一步） ==========
        loadData();
        renderAll();
    </script>
</body>
</html>
