<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎀 BJD萌萌体管理屋 🎀</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink-50: #fff0f3;
            --pink-100: #ffd1dc;
            --pink-200: #ffb3c6;
            --pink-300: #ff8fab;
            --pink-400: #ff758f;
            --pink-500: #ff4d6d;
            --pink-600: #e83e5c;
            --pink-700: #c9184a;
            --pink-800: #a4133c;
            --red-500: #f43f5e;
            --red-600: #e11d48;
            --cream: #fff5f7;
            --white: #ffffff;
            --shadow-soft: 0 4px 20px rgba(255, 77, 109, 0.15);
            --shadow-cute: 0 8px 32px rgba(255, 77, 109, 0.2);
        }

        body {
            font-family: 'Nunito', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--pink-50) 0%, var(--cream) 50%, var(--pink-100) 100%);
            min-height: 100vh;
            color: var(--pink-800);
            overflow-x: hidden;
        }

        /* 可爱背景装饰 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-decoration::before,
        .bg-decoration::after {
            content: '♥';
            position: absolute;
            font-size: 200px;
            opacity: 0.03;
            color: var(--pink-500);
            animation: float 20s infinite ease-in-out;
        }

        .bg-decoration::before {
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }

        .bg-decoration::after {
            bottom: 10%;
            right: 5%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        /* 头部 */
        .header {
            position: relative;
            z-index: 10;
            background: linear-gradient(135deg, var(--pink-300) 0%, var(--pink-500) 100%);
            padding: 20px;
            box-shadow: var(--shadow-cute);
            border-radius: 0 0 30px 30px;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .logo-text h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 28px;
            color: var(--white);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .logo-text p {
            color: var(--pink-100);
            font-size: 13px;
            margin-top: 2px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-tab {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: var(--white);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .nav-tab:hover {
            background: rgba(255,255,255,0.35);
            transform: translateY(-2px);
        }

        .nav-tab.active {
            background: var(--white);
            color: var(--pink-600);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* 主内容区 */
        .main-container {
            position: relative;
            z-index: 5;
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px;
        }

        .section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 卡片样式 */
        .card {
            background: var(--white);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-soft);
            border: 2px solid var(--pink-100);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-cute);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed var(--pink-200);
        }

        .card-title-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--pink-300), var(--pink-500));
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
        }

        .card-title h2 {
            font-size: 20px;
            color: var(--pink-700);
            font-weight: 700;
        }

        .card-title h2 span {
            display: block;
            font-size: 12px;
            color: var(--pink-400);
            font-weight: 500;
            margin-top: 2px;
        }

        /* 按钮 */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.4);
        }

        .btn-secondary {
            background: var(--pink-50);
            color: var(--pink-600);
            border: 2px solid var(--pink-200);
        }

        .btn-secondary:hover {
            background: var(--pink-100);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 15px;
        }

        /* 输入框 */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--pink-700);
        }

        .form-label::after {
            content: ' *';
            color: var(--red-500);
        }

        .form-label.optional::after {
            content: '';
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--pink-200);
            border-radius: 16px;
            font-size: 14px;
            color: var(--pink-800);
            background: var(--pink-50);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--pink-500);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.1);
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        /* 网格布局 */
        .grid {
            display: grid;
            gap: 20px;
        }

        .grid-2 {
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        .grid-3 {
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }

        .grid-4 {
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        /* 标签 */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tag-add {
            background: var(--pink-50);
            color: var(--pink-500);
            border: 2px dashed var(--pink-300);
        }

        .tag-add:hover {
            background: var(--pink-100);
            border-style: solid;
        }

        .tag-item {
            background: linear-gradient(135deg, var(--pink-300), var(--pink-500));
            color: white;
            box-shadow: 0 2px 8px rgba(255, 77, 109, 0.2);
        }

        .tag-item .tag-remove {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
        }

        .tag-item .tag-remove:hover {
            background: rgba(255,255,255,0.5);
        }

        /* 筛选面板 */
        .filter-panel {
            background: linear-gradient(135deg, var(--pink-50), var(--white));
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            border: 2px solid var(--pink-200);
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: end;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--pink-600);
            margin-bottom: 6px;
        }

        .range-inputs {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .range-inputs input {
            flex: 1;
            min-width: 80px;
        }

        .range-inputs span {
            color: var(--pink-400);
            font-size: 12px;
        }

        /* 素体卡片 */
        .body-card {
            background: var(--white);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            border: 2px solid var(--pink-100);
            transition: all 0.3s ease;
            position: relative;
        }

        .body-card:hover {
            transform: translateY(-5px) rotate(1deg);
            box-shadow: var(--shadow-cute);
        }

        .body-card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--pink-100), var(--pink-200));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            position: relative;
        }

        .body-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .body-card-image .no-image {
            font-size: 60px;
            opacity: 0.5;
        }

        .body-card-badges {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 700;
            color: white;
            backdrop-filter: blur(10px);
        }

        .badge-size { background: rgba(255, 77, 109, 0.85); }
        .badge-skin { background: rgba(255, 179, 198, 0.85); }
        .badge-custom { background: rgba(168, 85, 247, 0.85); }

        .body-card-content {
            padding: 20px;
        }

        .body-card-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--pink-700);
            margin-bottom: 5px;
        }

        .body-card-brand {
            font-size: 12px;
            color: var(--pink-400);
            margin-bottom: 15px;
        }

        .body-card-specs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .spec-item {
            background: var(--pink-50);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }

        .spec-item .spec-label {
            font-size: 10px;
            color: var(--pink-400);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .spec-item .spec-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--pink-600);
        }

        .body-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .body-card-tag {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 11px;
            background: var(--pink-100);
            color: var(--pink-600);
        }

        .body-card-actions {
            display: flex;
            gap: 10px;
        }

        .body-card-actions .btn {
            flex: 1;
            justify-content: center;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--white);
            border-radius: 30px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s ease;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            border: 3px solid var(--pink-200);
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px dashed var(--pink-200);
        }

        .modal-header h3 {
            font-size: 22px;
            color: var(--pink-700);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--pink-100);
            color: var(--pink-600);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: var(--pink-300);
            color: white;
            transform: rotate(90deg);
        }

        /* 尺寸表格 */
        .specs-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 15px;
        }

        .specs-table th,
        .specs-table td {
            padding: 12px 15px;
            text-align: left;
        }

        .specs-table th {
            background: linear-gradient(135deg, var(--pink-300), var(--pink-400));
            color: white;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .specs-table th:first-child {
            border-radius: 15px 0 0 0;
        }

        .specs-table th:last-child {
            border-radius: 0 15px 0 0;
        }

        .specs-table tr:nth-child(even) td {
            background: var(--pink-50);
        }

        .specs-table tr:hover td {
            background: var(--pink-100);
        }

        .specs-table td {
            font-size: 14px;
            color: var(--pink-700);
            border-bottom: 1px solid var(--pink-100);
        }

        /* 图片上传区域 */
        .upload-zone {
            border: 3px dashed var(--pink-300);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            background: var(--pink-50);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-zone:hover {
            border-color: var(--pink-500);
            background: var(--pink-100);
        }

        .upload-zone.active {
            border-color: var(--pink-500);
            background: var(--pink-100);
        }

        .upload-zone-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-zone-text {
            color: var(--pink-600);
            font-size: 14px;
            font-weight: 600;
        }

        .upload-zone-hint {
            color: var(--pink-400);
            font-size: 12px;
            margin-top: 8px;
        }

        /* 衣橱物品 */
        .wardrobe-item {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: var(--pink-50);
            border-radius: 20px;
            margin-bottom: 15px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .wardrobe-item:hover {
            border-color: var(--pink-300);
            transform: translateX(5px);
        }

        .wardrobe-item-image {
            width: 100px;
            height: 100px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--pink-200), var(--pink-300));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            flex-shrink: 0;
        }

        .wardrobe-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }

        .wardrobe-item-info {
            flex: 1;
        }

        .wardrobe-item-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--pink-700);
            margin-bottom: 5px;
        }

        .wardrobe-item-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .meta-tag {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .meta-color {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .color-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--pink-200);
        }

        /* 发片/脸片卡片 */
        .face-plate-card {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-soft);
            border: 2px solid var(--pink-100);
            transition: all 0.3s ease;
        }

        .face-plate-card:hover {
            transform: translateY(-5px);
        }

        .face-plate-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, var(--pink-200), var(--pink-300));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .face-plate-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 18px;
            color: var(--pink-400);
            font-weight: 600;
        }

        .empty-state-hint {
            font-size: 13px;
            color: var(--pink-300);
            margin-top: 10px;
        }

        /* 颜色选择器 */
        .color-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }

        .color-option {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .color-option:hover {
            transform: scale(1.15);
        }

        .color-option.selected {
            border-color: var(--pink-600);
            box-shadow: 0 0 0 3px var(--pink-200);
        }

        .color-option.selected::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        /* 统计数字 */
        .stat-number {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--pink-500), var(--red-500));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 13px;
            color: var(--pink-400);
            font-weight: 600;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .nav-tabs {
                justify-content: center;
            }

            .filter-row {
                flex-direction: column;
            }

            .filter-group {
                width: 100%;
            }

            .body-card-specs {
                grid-template-columns: repeat(2, 1fr);
            }

            .wardrobe-item {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--pink-50);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--pink-300), var(--pink-500));
            border-radius: 10px;
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--pink-200);
            border-top-color: var(--pink-500);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 提示气泡 */
        .tooltip {
            position: relative;
        }

        .tooltip::after {
            content: attr(data-tip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            padding: 8px 16px;
            background: var(--pink-700);
            color: white;
            font-size: 12px;
            border-radius: 12px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;

        .tooltip:hover::after {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);

        }

            max-height: 2000px;
        }

            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 15px;

            top: -10px;
            right: -10px;
            width: 28px;
            height: 28px;
