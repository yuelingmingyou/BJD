<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎀 BJD管理屋 🎀</title>
    <style>
        /* ... 样式保持不变，沿用你的样式 ... */
        /* 为节省空间，样式部分省略，请保留你原有的完整样式 */
    </style>
</head>
<body>
    <!-- 头部 -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">🎀</div>
            <div class="logo-text">
                <h1>BJD管理屋</h1>
                <p>素体 · 衣橱 · 发片脸片一站式管理</p>
            </div>
        </div>
        <div class="nav-grid">
            <button class="nav-btn nav-btn-active" onclick="switchTab('bodies')" id="nav-bodies">🧸 素体管理</button>
            <button class="nav-btn nav-btn-inactive" onclick="switchTab('wardrobe')" id="nav-wardrobe">👗 娃衣橱</button>
            <button class="nav-btn nav-btn-inactive" onclick="switchTab('faceplates')" id="nav-faceplates">😊 脸片管理</button>
            <button class="nav-btn nav-btn-inactive" onclick="switchTab('wigs')" id="nav-wigs">💇 发片管理</button>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="main-container">
        <!-- 素体管理 -->
        <section id="section-bodies" class="section active">
            <div class="stats-scroll">
                <div class="stat-card">
                    <div class="stat-number" id="stat-bodies">0</div>
                    <div class="stat-label">素体总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-brands">0</div>
                    <div class="stat-label">厂家数量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-avg-height">0</div>
                    <div class="stat-label">平均身高cm</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-wigs">0</div>
                    <div class="stat-label">发片数</div>
                </div>
            </div>

            <div class="filter-panel">
                <div class="filter-row">
                    <select class="form-select" id="filter-size" onchange="renderBodies()">
                        <option value="">全部尺寸</option>
                        <option value="十二分">十二分</option>
                        <option value="八分">八分</option>
                        <option value="六分">六分</option>
                        <option value="特六">特六</option>
                        <option value="四分">四分</option>
                        <option value="三分">三分</option>
                        <option value="叔体">叔体</option>
                    </select>
                    <select class="form-select" id="filter-skin" onchange="renderBodies()">
                        <option value="">全部肤色</option>
                        <option value="白肌">白肌</option>
                        <option value="普肌">普肌</option>
                        <option value="黄肌">黄肌</option>
                        <option value="烧肌">烧肌</option>
                        <option value="粉肌">粉肌</option>
                        <option value="半白">半白</option>
                    </select>
                </div>
                <div class="filter-row">
                    <input type="text" class="form-input" id="filter-brand" placeholder="厂家筛选" oninput="renderBodies()">
                    <input type="number" class="form-input" id="filter-foot-min" placeholder="脚长最小" step="0.1" onchange="renderBodies()">
                    <input type="number" class="form-input" id="filter-foot-max" placeholder="脚长最大" step="0.1" onchange="renderBodies()">
                </div>
                <div class="filter-row" style="margin-bottom:0;">
                    <button class="btn btn-sm btn-secondary" onclick="clearFilters()">🗑️ 清空</button>
                    <button class="btn btn-sm btn-secondary" onclick="exportData()">💾 导出</button>
                    <button class="btn btn-sm btn-secondary" onclick="document.getElementById('import-file').click()">📁 导入</button>
                    <input type="file" id="import-file" style="display:none;" accept=".json" onchange="importData(event)">
                </div>
            </div>

            <div id="bodies-list"></div>
            <div id="bodies-empty" class="empty-state show">
                <div class="empty-state-icon">🧸</div>
                <div class="empty-state-text">还没有素体哦~</div>
                <div style="font-size:13px;color:var(--pink-300);margin-top:8px;">点击右下角 + 按钮添加</div>
            </div>
        </section>

        <!-- 娃衣橱 -->
        <section id="section-wardrobe" class="section">
            <div class="card">
                <div class="card-title">
                    <div class="card-title-icon">👗</div>
                    <h2>我的娃衣橱</h2>
                </div>
                <div class="filter-row" style="margin-bottom:15px;">
                    <select class="form-select" id="wardrobe-filter-type" onchange="renderWardrobe()">

                        <option value="上衣">上衣</option>
                        <option value="下装">下装</option>
                        <option value="连衣裙">连衣裙</option>
                        <option value="外套">外套</option>
                        <option value="鞋子">鞋子</option>
                        <option value="袜子">袜子</option>
                        <option value="配饰">配饰</option>
                        <option value="假发">假发</option>
                        <option value="眼珠">眼珠</option>
                        <option value="其他">其他</option>
                    </select>
                    <input type="text" class="form-input" id="wardrobe-filter-color" placeholder="颜色筛选" oninput="renderWardrobe()">
                    <input type="text" class="form-input" id="wardrobe-filter-size" placeholder="尺寸筛选" oninput="renderWardrobe()">

                <div id="wardrobe-list"></div>
                <div id="wardrobe-empty" class="empty-state show">

        <!-- 脸片管理 -->

                </div>

                <div id="faceplates-empty" class="empty-state show">
                    <div class="empty-state-icon">😊</div>
                    <div class="empty-state-text">还没有脸片~</div>
                </div>
            </div>
        </section>

        <!-- 发片管理 -->
        <section id="section-wigs" class="section">
            <div class="card">
                <div class="card-title">
                    <div class="card-title-icon">💇</div>
                    <h2>发片/假发</h2>
                    <button class="btn btn-primary btn-sm" style="margin-left:auto;" onclick="showAddWigModal()">➕ 添加</button>
                </div>
                <div id="wigs-list" class="grid-2"></div>
                <div id="wigs-empty" class="empty-state show">
                    <div class="empty-state-icon">💇</div>
                    <div class="empty-state-text">还没有发片~</div>
                </div>

    </main>

    <!-- 浮动按钮 - 仅素体管理显示 -->

    </div>

    <!-- ========== 模态框：添加素体 ========== -->

                            <option value="六分">六分</option>
                            <option value="特六">特六</option>
                            <option value="四分">四分</option>

                    <div class="form-group">
                        <label class="form-label">肤色 *</label>
                        <select class="form-select" id="body-skin" required>

                            <option value="白肌">白肌</option>
                            <option value="普肌">普肌</option>
                            <option value="黄肌">黄肌</option>
                            <option value="烧肌">烧肌</option>
                            <option value="粉肌">粉肌</option>

                </div>

                <div class="card-title" style="margin:15px 0 12px;">

                    <h2 style="font-size:14px;">尺寸数据 (cm)</h2>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">头围</label>
                        <input type="number" class="form-input" id="body-head-c" step="0.1" placeholder="12.5">
                    </div>

                    <div class="form-group">

                    </div>

                            <option value="连衣裙">连衣裙</option>
                            <option value="外套">外套</option>
                            <option value="鞋子">鞋子</option>
                            <option value="袜子">袜子</option>
                            <option value="配饰">配饰</option>

                </div>
                <button type="submit" class="btn btn-primary btn-full">💾 保存发片</button>
            </form>
        </div>
    </div>

    <script>
        // ==================== 数据 ====================
        let data = {
            bodies: [],
            wardrobes: [],
            faceplates: [],
            wigs: []
        };

        // 临时存储图片数据（base64）
        let tempImages = {};

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            renderAll();
        });

        // ==================== 数据持久化 ====================
        function loadData() {
            try {
                const saved = localStorage.getItem('bjd_management_data');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    data = parsed;
                }
            } catch (e) {
                console.warn('加载数据失败', e);
            }
        }

        function saveData() {
            try {
                localStorage.setItem('bjd_management_data', JSON.stringify(data));
            } catch (e) {
                console.warn('保存数据失败', e);
            }
        }

        // ==================== 导出/导入 ====================
        function exportData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bjd_data_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.bodies && imported.wardrobes && imported.faceplates && imported.wigs) {
                        data = imported;
                        saveData();
                        renderAll();
                        alert('✅ 导入成功！');
                    } else {
                        alert('❌ 数据格式不正确');
                    }
                } catch (err) {
                    alert('❌ 导入失败：' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ==================== Tab 切换 ====================
        function switchTab(tab) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.className = 'nav-btn nav-btn-inactive');
            
            document.getElementById('section-' + tab).classList.add('active');
            document.getElementById('nav-' + tab).className = 'nav-btn nav-btn-active';

            // 控制浮动按钮显示
            const fab = document.getElementById('fab-container');
            if (tab === 'bodies') {
                fab.style.display = 'block';
            } else {
                fab.style.display = 'none';
            }

            // 切换时重新渲染
            if (tab === 'wardrobe') renderWardrobe();
            if (tab === 'faceplates') renderFaceplates();
            if (tab === 'wigs') renderWigs();
        }

        // ==================== 模态框 ====================
        function openModal(id) {
            document.getElementById(id).classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            document.body.style.overflow = '';
        }

        // 点击遮罩关闭
        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });
        });

        // ==================== 图片上传 ====================
        function triggerFileInput(id) {
            const input = document.getElementById(id);
            if (input) {
                // 防止事件冲突
                input.click();
            }
        }

            // 重置input以便重复选择同一文件
