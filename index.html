<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJD管理屋</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #fff0f3 0%, #fff5f7 50%, #ffd1dc 100%);
            min-height: 100vh;
            color: #c9184a;
        }
        .header {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff4d6d 100%);
            padding: 20px 15px 25px;
            border-radius: 0 0 30px 30px;
            color: white;
        }
        .header h1 { font-size: 26px; font-weight: 800; }
        .header p { font-size: 12px; opacity: 0.85; margin-top: 5px; }
        
        .nav {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-width: 500px;
            margin: 15px auto 0;
        }
        .nav button {
            padding: 12px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: rgba(255,255,255,0.25);
            color: white;
        }
        .nav button.active {
            background: white;
            color: #e83e5c;
        }
        
        .main { padding: 15px; max-width: 800px; margin: 0 auto; }
        .section { display: none; }
        .section.active { display: block; }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(255, 77, 109, 0.15);
            border: 2px solid #ffd1dc;
        }
        .card h2 {
            font-size: 17px;
            color: #c9184a;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px dashed #ffb3c6;
        }
        
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 16px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #ff758f, #e83e5c);
            color: white;
        }
        .btn-secondary {
            background: #fff0f3;
            color: #e83e5c;
            border: 2px solid #ffb3c6;
        }
        
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #c9184a;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ffb3c6;
            border-radius: 14px;
            font-size: 15px;
            color: #a4133c;
            background: #fff0f3;
        }
        
        .upload-zone {
            border: 3px dashed #ffb3c6;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            background: #fff0f3;
            cursor: pointer;
        }
        .upload-zone .icon { font-size: 40px; margin-bottom: 10px; }
        .upload-zone .text { color: #e83e5c; font-size: 14px; font-weight: 700; }
        
        .body-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 12px;
            display: flex;
            box-shadow: 0 4px 20px rgba(255, 77, 109, 0.15);
            border: 2px solid #ffd1dc;
        }
        .body-card .img {
            width: 120px;
            min-height: 120px;
            background: linear-gradient(135deg, #ffd1dc, #ffb3c6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            flex-shrink: 0;
        }
        .body-card .img img { width: 100%; height: 100%; object-fit: cover; }
        .body-card .info { padding: 15px; flex: 1; }
        .body-card .name { font-size: 16px; font-weight: 700; color: #c9184a; }
        .body-card .brand { font-size: 12px; color: #ff8fab; margin-top: 3px; }
        .body-card .specs {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .body-card .spec {
            padding: 4px 10px;
            background: #fff0f3;
            border-radius: 10px;
            font-size: 11px;
        }
        .body-card .spec span:first-child { color: #ff8fab; }
        .body-card .spec span:last-child { color: #e83e5c; font-weight: 700; }
        
        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff758f, #e83e5c);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.4);
        }
        
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: flex-end;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: 30px 30px 0 0;
            padding: 25px 20px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s;
        }
        .modal-overlay.active .modal { transform: translateY(0); }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #ffb3c6;
        }
        .modal-header h3 { font-size: 20px; color: #c9184a; }
        .modal-close {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: none;
            background: #ffd1dc;
            color: #e83e5c;
            font-size: 18px;
            cursor: pointer;
        }
        
        .empty { text-align: center; padding: 50px; display: none; }
        .empty.show { display: block; }
        .empty .icon { font-size: 60px; opacity: 0.4; }
        .empty .text { font-size: 16px; color: #ff8fab; font-weight: 700; margin-top: 15px; }
        
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎀 BJD管理屋</h1>
        <p>素体 · 衣橱 · 发片脸片一站式管理</p>
        <div class="nav">
            <button class="active" onclick="switchTab('bodies')" id="nav-bodies">🧸 素体管理</button>
            <button onclick="switchTab('wardrobe')" id="nav-wardrobe">👗 娃衣橱</button>
            <button onclick="switchTab('faceplates')" id="nav-faceplates">😊 脸片管理</button>
            <button onclick="switchTab('wigs')" id="nav-wigs">💇 发片管理</button>
        </div>
    </div>

    <div class="main">
        <!-- 素体 -->
        <div class="section active" id="section-bodies">
            <div class="card">
                <h2>📊 统计</h2>
                <p>素体数量: <span id="count-bodies">0</span></p>
            </div>
            <div class="card">
                <h2>🔍 筛选</h2>
                <div class="grid-2">
                    <select class="form-group" id="filter-size" onchange="renderBodies()" style="padding:12px;border-radius:14px;border:2px solid #ffb3c6;background:#fff0f3;color:#a4133c;">
                        <option value="">全部尺寸</option>
                        <option value="十二分">十二分</option>
                        <option value="八分">八分</option>
                        <option value="六分">六分</option>
                        <option value="特六">特六</option>
                        <option value="四分">四分</option>
                    </select>
                    <input type="text" placeholder="厂家筛选" id="filter-brand" oninput="renderBodies()" style="padding:12px;border-radius:14px;border:2px solid #ffb3c6;background:#fff0f3;color:#a4133c;">
                </div>
                <button class="btn btn-secondary" onclick="clearFilters()" style="margin-top:10px;">🗑️ 清空筛选</button>
            </div>
            <div id="bodies-list"></div>
            <div class="empty" id="bodies-empty">
                <div class="icon">🧸</div>
                <div class="text">还没有素体哦~<br>点击右下角 + 添加</div>
            </div>
        </div>

        <!-- 衣橱 -->
        <div class="section" id="section-wardrobe">
            <div class="card">
                <h2>👗 我的娃衣橱</h2>
                <div id="wardrobe-list"></div>
                <div class="empty" id="wardrobe-empty">
                    <div class="icon">👗</div>
                    <div class="text">衣橱是空的~</div>
                </div>
            </div>
        </div>

        <!-- 脸片 -->
        <div class="section" id="section-faceplates">
            <div class="card">
                <h2>😊 脸片收藏</h2>
                <div class="grid-2" id="faceplates-list"></div>
                <div class="empty" id="faceplates-empty">
                    <div class="icon">😊</div>
                    <div class="text">还没有脸片~</div>
                </div>
            </div>
        </div>

        <!-- 发片 -->
        <div class="section" id="section-wigs">
            <div class="card">
                <h2>💇 发片/假发</h2>
                <div class="grid-2" id="wigs-list"></div>
                <div class="empty" id="wigs-empty">
                    <div class="icon">💇</div>
                    <div class="text">还没有发片~</div>
                </div>
            </div>
        </div>
    </div>

    <button class="fab" onclick="showAddModal()">➕</button>

    <!-- 添加素体模态框 -->
    <div class="modal-overlay" id="modal-body">
        <div class="modal">
            <div class="modal-header">
                <h3>🧸 添加素体</h3>
                <button class="modal-close" onclick="closeModal('modal-body')">×</button>
            </div>
            <form onsubmit="saveBody(event)">
                <div class="form-group">
                    <label>素体图片</label>
                    <div class="upload-zone" onclick="document.getElementById('body-file').click()">
                        <div class="icon">📷</div>
                        <div class="text">点击上传素体图片</div>
                    </div>
                    <input type="file" id="body-file" style="display:none;" accept="image/*" onchange="previewImage(this, 'body-preview')">
                    <div id="body-preview" style="margin-top:10px;"></div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>素体名称 *</label>
                        <input type="text" id="body-name" required placeholder="例如：萌萌体">
                    </div>
                    <div class="form-group">
                        <label>厂家 *</label>
                        <input type="text" id="body-brand" required placeholder="例如：SOOM">
                    </div>
                    <div class="form-group">
                        <label>尺寸 *</label>
                        <select id="body-size" required>
                            <option value="">请选择</option>
                            <option value="十二分">十二分</option>
                            <option value="八分">八分</option>
                            <option value="六分">六分</option>
                            <option value="特六">特六</option>
                            <option value="四分">四分</option>
                            <option value="三分">三分</option>
                            <option value="叔体">叔体</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>肤色 *</label>
                        <select id="body-skin" required>
                            <option value="">请选择</option>
                            <option value="白肌">白肌</option>
                            <option value="普肌">普肌</option>
                            <option value="黄肌">黄肌</option>
                            <option value="烧肌">烧肌</option>
                            <option value="粉肌">粉肌</option>
                            <option value="半白">半白</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>脚长 (cm)</label>
                    <input type="number" id="body-foot" step="0.1" placeholder="1.8">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" id="body-notes" placeholder="购买渠道、妆师等...">
                </div>
                <button type="submit" class="btn" style="width:100%;margin-top:15px;">💾 保存素体</button>
            </form>
        </div>
    </div>

    <!-- 添加衣橱模态框 -->
    <div class="modal-overlay" id="modal-wardrobe">
        <div class="modal">
            <div class="modal-header">
                <h3>👗 添加物品</h3>
                <button class="modal-close" onclick="closeModal('modal-wardrobe')">×</button>
            </div>
            <form onsubmit="saveWardrobe(event)">
                <div class="form-group">
                    <label>物品名称 *</label>
                    <input type="text" id="wardrobe-name" required>
                </div>
                <div class="form-group">
                    <label>类型 *</label>
                    <select id="wardrobe-type" required>
                        <option value="">请选择</option>
                        <option value="上衣">上衣</option>
                        <option value="下装">下装</option>
                        <option value="连衣裙">连衣裙</option>
                        <option value="外套">外套</option>
                        <option value="鞋子">鞋子</option>
                        <option value="配饰">配饰</option>
                        <option value="眼珠">眼珠</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <button type="submit" class="btn" style="width:100%;margin-top:15px;">💾 保存物品</button>
            </form>
        </div>
    </div>

    <!-- 添加脸片模态框 -->
    <div class="modal-overlay" id="modal-faceplate">
        <div class="modal">
            <div class="modal-header">
                <h3>😊 添加脸片</h3>
                <button class="modal-close" onclick="closeModal('modal-faceplate')">×</button>
            </div>
            <form onsubmit="saveFaceplate(event)">
                <div class="form-group">
                    <label>脸片名称 *</label>
                    <input type="text" id="faceplate-name" required>
                </div>
                <div class="form-group">
                    <label>适配眼珠尺寸</label>
                    <input type="text" id="faceplate-eye" placeholder="例如：14mm">
                </div>
                <button type="submit" class="btn" style="width:100%;margin-top:15px;">💾 保存脸片</button>
            </form>
        </div>
    </div>

    <!-- 添加发片模态框 -->
    <div class="modal-overlay" id="modal-wig">
        <div class="modal">
            <div class="modal-header">
                <h3>💇 添加发片</h3>
                <button class="modal-close" onclick="closeModal('modal-wig')">×</button>
            </div>
            <form onsubmit="saveWig(event)">
                <div class="form-group">
                    <label>发片名称 *</label>
                    <input type="text" id="wig-name" required>
                </div>
                <div class="form-group">
                    <label>颜色</label>
                    <input type="text" id="wig-color" placeholder="粉色">
                </div>
                <button type="submit" class="btn" style="width:100%;margin-top:15px;">💾 保存发片</button>
            </form>
        </div>
    </div>

    <script>
        // 数据
        var data = { bodies: [], wardrobe: [], faceplates: [], wigs: [] };
        var currentTab = 'bodies';
        var tempImage = '';

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            renderAll();
        });

        // 切换标签
        function switchTab(tab) {
            currentTab = tab;
            
            // 更新按钮样式
            var buttons = document.querySelectorAll('.nav button');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].className = '';
            }
            document.getElementById('nav-' + tab).className = 'active';
            
            // 切换显示
            var sections = document.querySelectorAll('.section');
            for (var i = 0; i < sections.length; i++) {
                sections[i].className = 'section';
            }
            document.getElementById('section-' + tab).className = 'section active';
            
            renderAll();
        }

        // 显示添加模态框
        function showAddModal() {
            var map = { bodies: 'modal-body', wardrobe: 'modal-wardrobe', faceplates: 'modal-faceplate', wigs: 'modal-wig' };
            var modal = document.getElementById(map[currentTab]);
            modal.className = 'modal-overlay active';
            tempImage = '';
            document.getElementById('body-preview').innerHTML = '';
        }

        // 关闭模态框
        function closeModal(id) {
            document.getElementById(id).className = 'modal-overlay';
        }

        // 图片预览
        function previewImage(input, previewId) {
            var file = input.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                tempImage = e.target.result;
                document.getElementById(previewId).innerHTML = '<img src="' + e.target.result + '" style="max-width:150px;border-radius:14px;border:3px solid #ffb3c6;">';
            };
            reader.readAsDataURL(file);
        }

        // 保存素体
        function saveBody(e) {
            e.preventDefault();
            var body = {
                id: Date.now().toString(),
                name: document.getElementById('body-name').value,
                brand: document.getElementById('body-brand').value,
                size: document.getElementById('body-size').value,
                skin: document.getElementById('body-skin').value,
                foot: document.getElementById('body-foot').value,
                notes: document.getElementById('body-notes').value,
                image: tempImage
            };
            data.bodies.push(body);
            saveData();
            closeModal('modal-body');
            e.target.reset();
            renderBodies();
        }

        // 保存衣橱
        function saveWardrobe(e) {
            e.preventDefault();
            data.wardrobe.push({
                id: Date.now().toString(),
                name: document.getElementById('wardrobe-name').value,
                type: document.getElementById('wardrobe-type').value
            });
            saveData();
            closeModal('modal-wardrobe');
            e.target.reset();
            renderWardrobe();
        }

        // 保存脸片
        function saveFaceplate(e) {
            e.preventDefault();
            data.faceplates.push({
                id: Date.now().toString(),
                name: document.getElementById('faceplate-name').value,
                eyeSize: document.getElementById('faceplate-eye').value
            });
            saveData();
            closeModal('modal-faceplate');
            e.target.reset();
            renderFaceplates();
        }

        // 保存发片
        function saveWig(e) {
            e.preventDefault();
            data.wigs.push({
                id: Date.now().toString(),
                name: document.getElementById('wig-name').value,
                color: document.getElementById('wig-color').value
            });
            saveData();
            closeModal('modal-wig');
            e.target.reset();
            renderWigs();
        }

        // 渲染
        function renderAll() {
            renderBodies();
            renderWardrobe();
            renderFaceplates();
            renderWigs();
        }

        function renderBodies() {
            var list = document.getElementById('bodies-list');
            var empty = document.getElementById('bodies-empty');
            var sizeFilter = document.getElementById('filter-size').value;
            var brandFilter = document.getElementById('filter-brand').value.toLowerCase();
            
            var filtered = [];
            for (var i = 0; i < data.bodies.length; i++) {
                var b = data.bodies[i];
                if (sizeFilter && b.size !== sizeFilter) continue;
                if (brandFilter && b.brand.toLowerCase().indexOf(brandFilter) === -1) continue;
                filtered.push(b);
            }
            
            document.getElementById('count-bodies').textContent = data.bodies.length;
            
            if (filtered.length === 0) {
                list.innerHTML = '';
                empty.className = 'empty show';
                return;
            }
            empty.className = 'empty';
            
            var html = '';
            for (var i = 0; i < filtered.length; i++) {
                var b = filtered[i];
                html += '<div class="body-card">';
                html += '<div class="img">' + (b.image ? '<img src="' + b.image + '">' : '🧸') + '</div>';
                html += '<div class="info">';
                html += '<div class="name">' + b.name + '</div>';
                html += '<div class="brand">' + b.brand + ' · ' + b.size + ' · ' + b.skin + '</div>';
                html += '<div class="specs">';
                if (b.foot) html += '<div class="spec"><span>脚</span> <span>' + b.foot + 'cm</span></div>';
                html += '</div>';
                if (b.notes) html += '<div style="font-size:12px;color:#ff8fab;margin-top:8px;">' + b.notes + '</div>';
                html += '</div></div>';
            }
            list.innerHTML = html;
        }

        function renderWardrobe() {
            var list = document.getElementById('wardrobe-list');
            var empty = document.getElementById('wardrobe-empty');
            if (data.wardrobe.length === 0) {
                list.innerHTML = '';
                empty.className = 'empty show';
                return;
            }
            empty.className = 'empty';
            var html = '';
            for (var i = 0; i < data.wardrobe.length; i++) {
                var w = data.wardrobe[i];
                html += '<div style="background:white;padding:15px;border-radius:16px;margin-bottom:10px;display:flex;align-items:center;gap:15px;">';
                html += '<div style="width:60px;height:60px;background:linear-gradient(135deg,#ffd1dc,#ffb3c6);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;">👗</div>';
                html += '<div style="flex:1;"><div style="font-weight:700;color:#c9184a;">' + w.name + '</div><div style="font-size:12px;color:#ff8fab;">' + w.type + '</div></div>';
                html += '</div>';
            }
            list.innerHTML = html;
        }

        function renderFaceplates() {
            var list = document.getElementById('faceplates-list');
            var empty = document.getElementById('faceplates-empty');
            if (data.faceplates.length === 0) {
                list.innerHTML = '';
                empty.className = 'empty show';
                return;
            }
            empty.className = 'empty';
            var html = '';
            for (var i = 0; i < data.faceplates.length; i++) {
                var f = data.faceplates[i];
                html += '<div style="background:white;padding:15px;border-radius:18px;text-align:center;">';
                html += '<div style="width:80px;height:80px;background:linear-gradient(135deg,#ffd1dc,#ffb3c6);border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:40px;">😊</div>';
                html += '<div style="font-weight:700;color:#c9184a;">' + f.name + '</div>';
                if (f.eyeSize) html += '<div style="font-size:12px;color:#ff8fab;">眼珠: ' + f.eyeSize + '</div>';
                html += '</div>';
            }
            list.innerHTML = html;
        }

        function renderWigs() {
            var list = document.getElementById('wigs-list');
            var empty = document.getElementById('wigs-empty');
            if (data.wigs.length === 0) {
                list.innerHTML = '';
                empty.className = 'empty show';
                return;
            }
            empty.className = 'empty';
            var html = '';
            for (var i = 0; i < data.wigs.length; i++) {
                var w = data.wigs[i];
                html += '<div style="background:white;padding:15px;border-radius:18px;text-align:center;">';
                html += '<div style="width:80px;height:80px;background:linear-gradient(135deg,#ffd1dc,#ffb3c6);border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:40px;">💇</div>';
                html += '<div style="font-weight:700;color:#c9184a;">' + w.name + '</div>';
                if (w.color) html += '<div style="font-size:12px;color:#ff8fab;">' + w.color + '</div>';
                html += '</div>';
            }
            list.innerHTML = html;
        }

        function clearFilters() {
            document.getElementById('filter-size').value = '';
            document.getElementById('filter-brand').value = '';
            renderBodies();
        }

        // 数据存储
        function saveData() {
            localStorage.setItem('bjd-data', JSON.stringify(data));
        }

        function loadData() {
            var saved = localStorage.getItem('bjd-data');
            if (saved) {
                try { data = JSON.parse(saved); } catch(e) {}
            }
        }

        // 点击外部关闭
        document.addEventListener('click', function(e) {
            if (e.target.className === 'modal-overlay active') {
                e.target.className = 'modal-overlay';
            }
        });
    </script>
</body>
</html>
