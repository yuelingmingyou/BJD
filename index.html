<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎀 BJD管理屋 🎀</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --pink-50: #fff0f3;
            --pink-100: #ffd1dc;
            --pink-200: #ffb3c6;
            --pink-300: #ff8fab;
            --pink-400: #ff758f;
            --pink-500: #ff4d6d;
            --pink-600: #e83e5c;
            --pink-700: #c9184a;
            --pink-800: #a4133c;
            --shadow-soft: 0 4px 20px rgba(255, 77, 109, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, var(--pink-50) 0%, #fff5f7 50%, var(--pink-100) 100%);
            min-height: 100vh;
            color: var(--pink-800);
            padding-bottom: 80px;
        }

        .header {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 30%, #ff4d6d 100%);
            padding: 20px 15px 25px;
            border-radius: 0 0 30px 30px;
            position: relative;
        }

        .header::before {
            content: '♥';
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 50px;
            opacity: 0.08;
            color: white;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .logo-icon {
            width: 55px;
            height: 55px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .logo-text h1 {
            font-size: 26px;
            color: white;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .logo-text p {
            color: rgba(255,255,255,0.85);
            font-size: 12px;
            margin-top: 4px;
        }

        .nav {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        .nav button {
            padding: 12px 16px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,255,255,0.25);
            color: white;
        }

        .nav button.active {
            background: white;
            color: var(--pink-600);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .main {
            padding: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .stats-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 5px 0 15px;
            scrollbar-width: none;
        }

        .stats-scroll::-webkit-scrollbar {
            display: none;
        }

        .stat-card {
            min-width: 130px;
            background: white;
            border-radius: 20px;
            padding: 18px;
            text-align: center;
            box-shadow: var(--shadow-soft);
            border: 2px solid var(--pink-100);
        }

        .stat-number {
            font-size: 36px;
            font-weight: 800;
            color: var(--pink-500);
            line-height: 1;
        }

        .stat-label {
            font-size: 12px;
            color: var(--pink-400);
            font-weight: 600;
            margin-top: 8px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: var(--shadow-soft);
            border: 2px solid var(--pink-100);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px dashed var(--pink-200);
        }

        .card-title-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--pink-300), var(--pink-500));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
        }

        .card-title h2 {
            font-size: 17px;
            color: var(--pink-700);
            font-weight: 700;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 16px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }

        .btn-secondary {
            background: var(--pink-50);
            color: var(--pink-600);
            border: 2px solid var(--pink-200);
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 12px;
        }

        .btn-full {
            width: 100%;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--pink-700);
        }

        .form-label .required {
            color: var(--pink-500);
            margin-left: 2px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--pink-200);
            border-radius: 14px;
            font-size: 15px;
            color: var(--pink-800);
            background: var(--pink-50);
            font-family: inherit;
            -webkit-appearance: none;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--pink-500);
            background: white;
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        /* 素体卡片 */
        .body-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            border: 2px solid var(--pink-100);
            margin-bottom: 15px;
            display: flex;
            transition: transform 0.2s;
        }

        .body-card:active {
            transform: scale(0.98);
        }

        .body-card-image {
            width: 130px;
            min-height: 130px;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--pink-100), var(--pink-200));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .body-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-image {
            font-size: 50px;
            opacity: 0.4;
        }

        .body-card-badges {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            color: white;
        }

        .badge-size {
            background: rgba(255, 77, 109, 0.9);
        }

        .badge-skin {
            background: rgba(255, 179, 198, 0.9);
        }

        .body-card-content {
            flex: 1;
            padding: 15px;
            min-width: 0;
        }

        .body-card-name {
            font-size: 17px;
            font-weight: 700;
            color: var(--pink-700);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .body-card-info {
            font-size: 12px;
            color: var(--pink-400);
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .body-card-info .label {
            color: var(--pink-500);
            font-weight: 600;
        }

        .body-card-specs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .spec-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            background: var(--pink-50);
            border-radius: 12px;
            font-size: 12px;
        }

        .spec-pill .label {
            color: var(--pink-400);
            font-weight: 500;
        }

        .spec-pill .value {
            color: var(--pink-600);
            font-weight: 700;
            font-size: 13px;
        }

        .body-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            background: var(--pink-100);
            color: var(--pink-600);
            font-weight: 600;
        }

        .tag-custom {
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            color: white;
        }

        /* 展开详情 */
        .detail-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px;
            color: var(--pink-500);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            border-top: 2px dashed var(--pink-100);
        }

        .detail-section {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px dashed var(--pink-200);
        }

        .detail-section.show {
            display: block;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .detail-item {
            padding: 12px;
            background: var(--pink-50);
            border-radius: 14px;
            text-align: center;
        }

        .detail-item .label {
            font-size: 11px;
            color: var(--pink-400);
            margin-bottom: 6px;
        }

        .detail-item .value {
            font-size: 18px;
            font-weight: 700;
            color: var(--pink-600);
        }

        .detail-item .unit {
            font-size: 11px;
            color: var(--pink-400);
            margin-left: 2px;
        }

        /* 筛选 */
        .filter-panel {
            background: linear-gradient(135deg, var(--pink-50), white);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid var(--pink-200);
        }

        .filter-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .filter-row:last-child {
            margin-bottom: 0;
        }

        .filter-row input, .filter-row select {
            flex: 1;
            min-width: 0;
        }

        /* 图片上传 */
        .upload-zone {
            border: 3px dashed var(--pink-300);
            border-radius: 18px;
            padding: 30px 20px;
            text-align: center;
            background: var(--pink-50);
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-zone:active {
            border-color: var(--pink-500);
            background: var(--pink-100);
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: var(--pink-600);
            font-size: 14px;
            font-weight: 700;
        }

        .upload-hint {
            color: var(--pink-400);
            font-size: 11px;
            margin-top: 6px;
        }

        .image-preview {
            position: relative;
            display: inline-block;
            margin-top: 12px;
        }

        .image-preview img {
            max-width: 160px;
            max-height: 160px;
            border-radius: 14px;
            border: 3px solid var(--pink-200);
        }

        .image-preview .remove {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 28px;
            height: 28px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 标签输入 */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .tag-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            background: var(--pink-50);
            color: var(--pink-500);
            border: 2px dashed var(--pink-300);
        }

        .tag-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--pink-300), var(--pink-500));
            color: white;
        }

        .tag-item .remove {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
        }

        /* 空状态 */
        .empty {
            text-align: center;
            padding: 60px 20px;
            display: none;
        }

        .empty.show {
            display: block;
        }

        .empty-icon {
            font-size: 70px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .empty-text {
            font-size: 16px;
            color: var(--pink-400);
            font-weight: 700;
        }

        .empty-hint {
            font-size: 13px;
            color: var(--pink-300);
            margin-top: 8px;
        }

        /* 浮动按钮 */
        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 77, 109, 0.4);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 30px 30px 0 0;
            padding: 25px 20px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed var(--pink-200);
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }

        .modal-header h3 {
            font-size: 20px;
            color: var(--pink-700);
            font-weight: 700;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--pink-100);
            color: var(--pink-600);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 衣橱物品 */
        .wardrobe-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            background: var(--pink-50);
            border-radius: 18px;
            margin-bottom: 12px;
            align-items: center;
        }

        .wardrobe-image {
            width: 70px;
            height: 70px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--pink-200), var(--pink-300));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            flex-shrink: 0;
        }

        .wardrobe-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
        }

        .wardrobe-info {
            flex: 1;
            min-width: 0;
        }

        .wardrobe-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--pink-700);
            margin-bottom: 6px;
        }

        .wardrobe-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .meta-tag {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: var(--pink-200);
            color: var(--pink-700);
        }

        /* 脸片/发片卡片 */
        .face-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .face-card {
            background: white;
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            box-shadow: var(--shadow-soft);
            border: 2px solid var(--pink-100);
        }

        .face-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 14px;
            background: linear-gradient(135deg, var(--pink-200), var(--pink-300));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            overflow: hidden;
        }

        .face-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .face-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--pink-700);
            margin-bottom: 6px;
        }

        .face-info {
            font-size: 12px;
            color: var(--pink-400);
            line-height: 1.6;
        }

        .face-actions {
            margin-top: 14px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* 隐藏 */
        .hidden {
            display: none !important;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--pink-300);
            border-radius: 10px;
        }

        @media (min-width: 768px) {
            .body-card-image {
                width: 160px;
            }
            
            .modal {
                max-width: 600px;
                margin: 0 auto;
                border-radius: 30px;
                max-height: 85vh;
            }
            
            .modal-overlay {
                align-items: center;
                padding: 20px;
            }
            
            .face-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">🎀</div>
            <div class="logo-text">
                <h1>BJD管理屋</h1>
                <p>素体 · 衣橱 · 发片脸片一站式管理</p>
            </div>
        </div>
        <div class="nav">
            <button class="active" onclick="switchTab('bodies')" id="nav-bodies">🧸 素体管理</button>
            <button onclick="switchTab('wardrobe')" id="nav-wardrobe">👗 娃衣橱</button>
            <button onclick="switchTab('faceplates')" id="nav-faceplates">😊 脸片管理</button>
            <button onclick="switchTab('wigs')" id="nav-wigs">💇 发片管理</button>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="main">
        <!-- 素体管理 -->
        <section class="section active" id="section-bodies">
            <div class="stats-scroll">
                <div class="stat-card">
                    <div class="stat-number" id="stat-bodies">0</div>
                    <div class="stat-label">素体总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-brands">0</div>
                    <div class="stat-label">厂家数量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-projects">0</div>
                    <div class="stat-label">企划数量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-wigs">0</div>
                    <div class="stat-label">发片数</div>
                </div>
            </div>

            <div class="filter-panel">
                <div class="filter-row">
                    <select class="form-input" id="filter-size" onchange="renderBodies()">
                        <option value="">全部尺寸</option>
                        <option value="十二分">十二分</option>
                        <option value="八分">八分</option>
                        <option value="六分">六分</option>
                        <option value="特六">特六</option>
                        <option value="四分">四分</option>
                        <option value="三分">三分</option>
                        <option value="叔体">叔体</option>
                    </select>
                    <select class="form-input" id="filter-skin" onchange="renderBodies()">
                        <option value="">全部肤色</option>
                        <option value="白肌">白肌</option>
                        <option value="普肌">普肌</option>
                        <option value="黄肌">黄肌</option>
                        <option value="烧肌">烧肌</option>
                        <option value="粉肌">粉肌</option>
                        <option value="半白">半白</option>
                    </select>
                </div>
                <div class="filter-row">
                    <input type="text" class="form-input" id="filter-brand" placeholder="厂家筛选" oninput="renderBodies()">
                    <input type="text" class="form-input" id="filter-project" placeholder="企划筛选" oninput="renderBodies()">
                </div>
                <div class="filter-row">
                    <input type="number" class="form-input" id="filter-foot-min" placeholder="脚长最小" step="0.1" onchange="renderBodies()">
                    <input type="number" class="form-input" id="filter-foot-max" placeholder="脚长最大" step="0.1" onchange="renderBodies()">
                    <button class="btn btn-sm btn-secondary" onclick="clearFilters()">🗑️ 清空</button>
                </div>
